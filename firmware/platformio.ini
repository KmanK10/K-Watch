[platformio]
default_envs = twatch-s3
boards_dir = boards

[env]
platform = espressif32
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
build_flags =
    -Wall
    -Wextra

[env:twatch-s3]
board = lilygo-twatch-s3

[env:twatch-2020-v3]
board = lilygo-twatch-2020-v3
